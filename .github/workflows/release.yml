name: "Publish HyperDisk Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (.deb, .rpm, .AppImage)
          - platform: "ubuntu-22.04"
            args: ""
            target: "x86_64-unknown-linux-gnu"

          # Windows x86_64 (.exe NSIS, .msi)
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

          # macOS Universal - Apple Silicon & Intel (.dmg, .app.tar.gz)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            target: "aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Sync version from git tag
        shell: bash
        run: |
          # Strip 'v' prefix from tag (v2.1.0 -> 2.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing version to: $VERSION"

          # Update package.json using node (cross-platform safe)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update src-tauri/tauri.conf.json using node
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

          # Update src-tauri/Cargo.toml (simple line replacement)
          node -e "
            const fs = require('fs');
            let toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            toml = toml.replace(/^version = \".*\"/m, 'version = \"$VERSION\"');
            fs.writeFileSync('src-tauri/Cargo.toml', toml);
          "

          echo "✅ All config files updated to version $VERSION"

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS x86_64 Target for Universal Build
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build & Publish Release Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "HyperDisk v__VERSION__"
          releaseBody: "Official HyperDisk Production Release for Linux, Windows, and macOS."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
