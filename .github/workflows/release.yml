name: "Publish AeroDisk Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (.deb, .rpm, .AppImage, .tar.gz)
          - platform: "ubuntu-22.04"
            args: ""
            target: "x86_64-unknown-linux-gnu"

          # Linux ARM64 / aarch64 (.deb, .rpm, .AppImage)
          - platform: "ubuntu-22.04"
            args: "--target aarch64-unknown-linux-gnu"
            target: "aarch64-unknown-linux-gnu"

          # Windows x86_64 (.exe NSIS, .msi)
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

          # Windows ARM64 (.exe)
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

          # macOS Universal / Apple Silicon & Intel (.dmg, .app.tar.gz)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            target: "universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Publish Release Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "AeroDisk v__VERSION__"
          releaseBody: "Official AeroDisk Production Release for Linux, Windows, and macOS."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
