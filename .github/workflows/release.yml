name: "Publish HyperDisk Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (.deb, .rpm, .AppImage)
          - platform: "ubuntu-22.04"
            args: ""
            target: "x86_64-unknown-linux-gnu"

          # Windows x86_64 (.exe NSIS, .msi)
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

          # macOS Universal - Apple Silicon & Intel (.dmg, .app.tar.gz)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            target: "aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          # Strip 'v' prefix from tag (v2.1.0 -> 2.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Sync version into config files
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Update package.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json && rm -f package.json.bak

          # Update src-tauri/tauri.conf.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak

          # Update src-tauri/Cargo.toml (only the package version line)
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

          echo "✅ All config files updated to version $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add macOS x86_64 Target for Universal Build
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build & Publish Release Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "HyperDisk v__VERSION__"
          releaseBody: "Official HyperDisk Production Release for Linux, Windows, and macOS."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
